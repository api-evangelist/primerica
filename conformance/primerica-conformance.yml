domain_standards:
  probed:
    - id: acord
      name: ACORD (insurance data and messaging standards)
      conforms: false
      evidence: https://www.primerica.com/sitemap.xml
      note: >-
        Primerica is a term-life and financial-services distributor, so ACORD is the obvious domain
        standard for its market. No ACORD message type, schema or conformance claim appears anywhere on
        its public surface. Reward-only check — recorded as an absence, not a penalty.
    - id: fdx
      name: Financial Data Exchange (FDX) API
      conforms: false
      evidence: https://gtw.primericaonline.com/.well-known/openid-configuration
      note: >-
        No FDX endpoints, no /fdx path, no FDX scopes. Third-party account aggregation of Primerica
        investment accounts is brokered by Pershing/NetXInvestor and Plaid, not by a Primerica-published
        FDX contract.
