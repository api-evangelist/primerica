specification: API Commons Conformance
specificationVersion: '0.1'
provider: Primerica
providerId: primerica
description: >-
  Cross-cutting standards Primerica's public surface actually demonstrates. Every `conforms: true` below
  is evidenced by a document Primerica serves anonymously; every `false` means we probed and found
  nothing, not that we did not look.
notes: >-
  Primerica publishes no OpenAPI, AsyncAPI, GraphQL SDL, WSDL or Protobuf contract on any reachable
  host, so none of the contract-shaped standards can be asserted. There is no domain-standard signature
  to record either: no ACORD message shapes, no FDX/PSD2 surface, no SCIM URNs and no OData $metadata
  appear anywhere on the public surface, and this pipeline does not invent one to fill the slot.
