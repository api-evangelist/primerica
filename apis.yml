description: >-
  Primerica, Inc. (NYSE: PRI) is a US and Canadian financial-services company that distributes term life
  insurance, mutual funds and annuities, mortgages, debt-consolidation, auto and home insurance,
  pre-paid legal services and identity-theft protection to middle-income households through a large
  independent sales force. Primerica operates no public or partner API programme: as of 2026-09-14 there
  is no developer portal, no published OpenAPI, AsyncAPI, GraphQL, WSDL or Protobuf contract, no SDK on
  any package registry, no MCP server, no status page and no API pricing. What it does publish to the
  open internet is machine-readable identity infrastructure — anonymous OAuth 2.0 and OpenID Connect
  discovery documents for the two Okta identity orgs behind the MyPrimerica client portal and the
  Primerica Online representative portal, and for its own Broadcom/CA Layer7 API gateway at
  gtw.primericaonline.com — together with a published responsible-disclosure policy.
