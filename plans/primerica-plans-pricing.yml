description: >-
  Primerica publishes no API plans, tiers or pricing of any kind. It has no developer portal and no
  public or partner API programme, so there is nothing to price. Its entire sitemap was searched on
  2026-09-14 and contains no developer, API or API-pricing page.
notes: >-
  A previous round of this profile carried a single synthetic "Contact Sales" plan written by the
  2026-05-04 bulk sweep. Primerica does not in fact publish a contact-sales path for API access either,
  so that plan asserted more than the evidence supports and has been removed in favour of an honest
  plan_count of 0. Consumer product pricing (term life premiums, fund fees) exists but is quoted per
  applicant by a licensed representative and is not an API plan.
