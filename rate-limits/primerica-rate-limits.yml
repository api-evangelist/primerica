notes: >-
  Responses from the anonymous OIDC discovery endpoints on login.my.primerica.com,
  login.primericaonline.com and gtw.primericaonline.com carried no X-RateLimit-*, RateLimit-* or
  Retry-After headers on 2026-09-14. No 429 behaviour is documented anywhere. The previous version of
  this file asserted "contract-defined limits" governed by partner agreements; no such partner agreement
  or programme is published, so that claim has been withdrawn and replaced with a measured zero.
