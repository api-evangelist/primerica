specification: API Evangelist Well-Known Probe
specificationVersion: '0.1'
provider: Primerica
providerId: primerica
description: >-
  Primerica publishes no security.txt, api-catalog, ai-plugin.json or A2A agent card on any host we can
  reach. It DOES serve real, anonymous OAuth 2.0 / OpenID Connect discovery documents on three
  first-party hosts: two Okta custom-domain identity orgs (login.my.primerica.com for the MyPrimerica
  client portal, login.primericaonline.com for the Primerica Online representative portal) and its own
  Broadcom/CA Layer7 API gateway (gtw.primericaonline.com). Those eight documents are the only
  machine-readable API artifacts Primerica publishes to the open internet.
notes: >-
  www.primerica.com answers HTTP 200 with a 97-byte "There was an error processing your request" body
  for every /.well-known/* path — a soft-200 catch-all, not a served document, and recorded as a miss.
  The apex primerica.com 302-redirects every path to www. developer.primerica.com and api.primerica.com,
  which a previous round of this profile recorded as the developer portal and API base, do not resolve
  at all (NXDOMAIN) and have been removed from apis.yml.
