specification: API Commons Authentication
specificationVersion: '0.1'
provider: Primerica
providerId: primerica
description: >-
  Primerica publishes no developer-facing API and no authentication documentation for third parties.
  It does, however, serve real anonymous OAuth 2.0 / OpenID Connect provider metadata for the identity
  systems behind its own first-party applications, and the MyPrimerica client portal ships its runtime
  OAuth client configuration as a public JavaScript file. This profile is derived entirely from those
  published discovery documents — it describes how Primerica's own apps authenticate, NOT a partner or
  public API programme, which does not exist.
notes: >-
  Nothing here is a credential and nothing here is obtainable by a third party. There is no public
  client registration, no developer signup, and no published partner onboarding path. Dynamic client
  registration endpoints are advertised in the metadata but are Okta/Layer7 platform defaults, not an
  open registration offer.
